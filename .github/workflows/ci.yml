name: "CI"

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  composer-validate:
    name: "Composer validate"
    runs-on: "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "none"
          tools: "composer"

      - name: "Validate composer.json"
        run: "composer validate --strict"

  deprecations:
    name: "Deprecation gate (PHP ${{ matrix.php-version }})"
    runs-on: "ubuntu-24.04"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"

      - name: "Scan src/ for deprecations with error_reporting=E_ALL"
        run: "./docker/app check-deprecations src"

  phpunit:
    name: "PHPUnit (PHP ${{ matrix.php-version }})"
    runs-on: "ubuntu-24.04"

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"
        dependencies:
          - "highest"
        include:
          # Covers the declared floors (guzzlehttp/psr7 2.12.3, ratchet/rfc6455 0.4.1, Symfony 5.4).
          - php-version: "8.0"
            dependencies: "lowest"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"
        with:
          fetch-depth: 2

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "${{ matrix.php-version }}"
          coverage: "none"
          ini-values: "zend.assertions=1"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "${{ matrix.dependencies }}"

      - name: "Run PHPUnit"
        run: "vendor/bin/phpunit"

  static-analysis:
    name: "PHPCS + PHPStan"
    runs-on: "ubuntu-24.04"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Install PHP"
        uses: "shivammathur/setup-php@v2"
        with:
          php-version: "8.4"
          coverage: "none"

      - name: "Install dependencies with Composer"
        uses: "ramsey/composer-install@v4"
        with:
          dependency-versions: "highest"

      - name: "Run PHPCS"
        run: "vendor/bin/phpcs"

      - name: "Run PHPStan"
        run: "vendor/bin/phpstan analyse --no-progress --error-format=github"

  docker-matrix:
    name: "Docker (PHP ${{ matrix.php-version }})"
    runs-on: "ubuntu-24.04"
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        php-version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
          - "8.5"

    steps:
      - name: "Checkout"
        uses: "actions/checkout@v6"

      - name: "Run test suite via docker/app"
        env:
          PHP_VERSION: "${{ matrix.php-version }}"
        run: "docker/app test"
